name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build everything but skip publishing: a dry run to
  # exercise the installers without cutting a release. Set "upload to"
  # to an existing release tag to refresh its stable-name download
  # assets (see the publish job).
  workflow_dispatch:
    inputs:
      upload_to:
        description: "Upload the stable-name download assets to this existing release (e.g. v1.1.1). Empty = dry run."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: .goreleaser/linux.yaml
          - os: macos-latest
            config: .goreleaser/darwin.yaml
          - os: windows-latest
            config: .goreleaser/windows.yaml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs the full history/changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Fyne dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev desktop-file-utils

      - name: Validate packaging metadata (Linux)
        if: runner.os == 'Linux'
        run: desktop-file-validate packaging/linux/roamming.desktop

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Build archives & packages (GoReleaser)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          # Snapshot mode for manual (non-tag) dry runs; goreleaser's own
          # NSIS support is Pro-only, so the Windows installer is built
          # by the step below from the exe this produces.
          args: >-
            release --clean --skip=publish,announce
            ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
            -f ${{ matrix.config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist -Recurse -Filter roamming.exe |
            Select-Object -First 1).FullName
          if (-not $exe) { throw "roamming.exe not found under dist/" }
          $ver = "${{ github.event.inputs.upload_to || github.ref_name }}".TrimStart("v")
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = "0.0.0" }
          $outfile = Join-Path (Resolve-Path dist) `
            "roamming_${ver}_windows_amd64_setup.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DVERSION=$ver /DEXE="$exe" /DOUTFILE="$outfile" `
            packaging\windows\roamming.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS installers (.pkg)
        if: runner.os == 'macOS'
        run: packaging/macos/package.sh
        env:
          VERSION: ${{ github.event.inputs.upload_to || github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.pkg
            dist/*_setup.exe
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.upload_to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # gh release create needs the git context

      - name: Download built archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          shopt -s nullglob
          cd dist
          sha256sum -- *.tar.gz *.zip *.deb *.rpm *.pkg.tar.zst *.pkg \
            *_setup.exe > checksums.txt
          cat checksums.txt

      # Version-free copies of the five download-button assets: the
      # releases/latest/download/<name> links in the README need stable
      # names. Byte-identical to the versioned files, so they are kept
      # out of checksums.txt on purpose.
      - name: Stable-name copies for direct downloads
        run: |
          cd dist
          cp roamming_*_linux_amd64.deb          roamming_linux_amd64.deb
          cp roamming_*_linux_x86_64.rpm         roamming_linux_x86_64.rpm
          cp roamming_*_linux_x86_64.pkg.tar.zst roamming_linux_x86_64.pkg.tar.zst
          cp roamming_*_darwin_universal.pkg     roamming_darwin_universal.pkg
          cp roamming_*_windows_amd64_setup.exe  roamming_windows_amd64_setup.exe

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.inputs.upload_to || github.ref_name }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            # manual run against an existing release: refresh only the
            # stable-name download assets
            gh release upload "$TARGET" --clobber \
              dist/roamming_linux_amd64.deb \
              dist/roamming_linux_x86_64.rpm \
              dist/roamming_linux_x86_64.pkg.tar.zst \
              dist/roamming_darwin_universal.pkg \
              dist/roamming_windows_amd64_setup.exe
          else
            gh release create "$TARGET" dist/* \
              --title "roamming $TARGET" \
              --generate-notes
          fi
