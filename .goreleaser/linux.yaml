version: 2

project_name: roamming

# Linux release config, run on the ubuntu runner by
# .github/workflows/release.yml (with .goreleaser/darwin.yaml and
# .goreleaser/windows.yaml running on the other runners; see
# .goreleaser.yaml for the master view).

builds:
  # Native on the ubuntu runner.
  # No linux/arm64 target: cross-compiling CGO to arm64 requires a full
  # multiarch sysroot that is fragile to maintain on CI runners.
  - id: linux-amd64
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Linux packages (deb/RHEL/Arch). GoReleaser adds the built binary at
# {{ .Bindir }} (/usr/bin) automatically; everything else ships via
# contents. The systemd user unit + postinstall give per-user autostart
# at login; the desktop entry and icons put roamming in app launchers.
nfpms:
  - id: packages
    package_name: roamming
    file_name_template: "{{ .ConventionalFileName }}"
    maintainer: Nathanael Bonfim <dev@nathabonfim59.com>
    homepage: https://github.com/nathabonfim59/roamming
    description: Set your external activity in Roam from the system tray
    formats:
      - deb
      - rpm
      - archlinux
    contents:
      - src: packaging/linux/roamming.service
        dst: /usr/lib/systemd/user/roamming.service
      - src: packaging/linux/roamming.desktop
        dst: /usr/share/applications/roamming.desktop
      # The icons are enumerated explicitly on purpose: nfpm's
      # `type: tree` copies the Go FileInfo of the source directories
      # into the tar headers, encoding the os.ModeDir flag as a
      # base-256 mode. Pacman compares raw st_mode and then warns
      # "directory permissions differ ... 755 package: 755" for every
      # directory in the tree. Plain file entries get clean octal
      # parent dirs (0000755) and install without warnings.
      - src: packaging/linux/icons/hicolor/16x16/apps/roamming.png
        dst: /usr/share/icons/hicolor/16x16/apps/roamming.png
      - src: packaging/linux/icons/hicolor/24x24/apps/roamming.png
        dst: /usr/share/icons/hicolor/24x24/apps/roamming.png
      - src: packaging/linux/icons/hicolor/32x32/apps/roamming.png
        dst: /usr/share/icons/hicolor/32x32/apps/roamming.png
      - src: packaging/linux/icons/hicolor/48x48/apps/roamming.png
        dst: /usr/share/icons/hicolor/48x48/apps/roamming.png
      - src: packaging/linux/icons/hicolor/64x64/apps/roamming.png
        dst: /usr/share/icons/hicolor/64x64/apps/roamming.png
      - src: packaging/linux/icons/hicolor/128x128/apps/roamming.png
        dst: /usr/share/icons/hicolor/128x128/apps/roamming.png
      - src: packaging/linux/icons/hicolor/256x256/apps/roamming.png
        dst: /usr/share/icons/hicolor/256x256/apps/roamming.png
      - src: packaging/linux/icons/hicolor/512x512/apps/roamming.png
        dst: /usr/share/icons/hicolor/512x512/apps/roamming.png
      - src: packaging/linux/icons/pixmaps/roamming.png
        dst: /usr/share/pixmaps/roamming.png
    scripts:
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
