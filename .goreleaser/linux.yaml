version: 2

project_name: roamming

# Linux release config, run on the ubuntu runner by
# .github/workflows/release.yml (with .goreleaser/darwin.yaml and
# .goreleaser/windows.yaml running on the other runners; see
# .goreleaser.yaml for the master view).

builds:
  # Native on the ubuntu runner.
  # No linux/arm64 target: cross-compiling CGO to arm64 requires a full
  # multiarch sysroot that is fragile to maintain on CI runners.
  - id: linux-amd64
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Linux packages (deb/RHEL/Arch). GoReleaser adds the built binary at
# {{ .Bindir }} (/usr/bin) automatically; everything else ships via
# contents. The systemd user unit + postinstall give per-user autostart
# at login; the desktop entry and icons put roamming in app launchers.
nfpms:
  - id: packages
    package_name: roamming
    file_name_template: "{{ .ConventionalFileName }}"
    maintainer: Nathanael Bonfim <dev@nathabonfim59.com>
    homepage: https://github.com/nathabonfim59/roamming
    description: Set your external activity in Roam from the system tray
    formats:
      - deb
      - rpm
      - archlinux
    contents:
      - src: packaging/linux/roamming.service
        dst: /usr/lib/systemd/user/roamming.service
      - src: packaging/linux/roamming.desktop
        dst: /usr/share/applications/roamming.desktop
      - src: packaging/linux/icons/hicolor
        dst: /usr/share/icons/hicolor
        type: tree
      - src: packaging/linux/icons/pixmaps/roamming.png
        dst: /usr/share/pixmaps/roamming.png
    scripts:
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
